name: Windows WSL2 project boundary
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Provision real Ubuntu 24.04 on WSL2
        timeout-minutes: 15
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: '2'
          use-cache: 'false'
      - name: Verify actual WSL argument transfer and project staging with PowerShell 5.1
        timeout-minutes: 5
        shell: powershell
        run: ./tests/windows-wsl.ps1 -DistroName Ubuntu-24.04
      - name: Verify same boundary with PowerShell 7
        timeout-minutes: 5
        shell: pwsh
        run: ./tests/windows-wsl.ps1 -DistroName Ubuntu-24.04
